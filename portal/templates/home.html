{% extends 'master/base.html' %}

{% block content %}
<div class="container">
    {% include 'message.html' %}
    <h1>home page</h1>

    <h1>Category Wise Jobs</h1>

    <div class="row">
        
        {% for i in data %}
            <div class="col-mt-4">
                <div class="card col-2 mt-4">
                    <div class="card-body">
                        <a href="{% url 'jb_list' %}?cate_id={{i.id}}">{{i.category}}</a>
                    </div>
                </div>

            </div>
            
        {% endfor %}
            
    </div>
    
</div>
{% endblock %}
